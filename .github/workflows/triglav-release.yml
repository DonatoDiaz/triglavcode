name: triglav-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (по умолчанию 1.19.0-triglav.1)"
        required: false
        default: "1.19.0-triglav.1"
  push:
    tags:
      - "triglav-*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: darwin-arm64
          - os: macos-13
            name: darwin-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/triglav-* ]]; then
            VERSION="${GITHUB_REF#refs/tags/triglav-}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $VERSION on ${{ matrix.name }}"

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build TriglavCode
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
        run: bun run script/build.ts --single --skip-install

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          DIR="$(ls -d packages/opencode/dist/triglavcode-* | head -1)"
          "./${DIR}/bin/triglavcode" --version
          mkdir -p release-artifacts
          tar -czf "release-artifacts/triglavcode-${VERSION}-linux-x64.tar.gz" -C "${DIR}/bin" triglavcode

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          DIR="$(ls -d packages/opencode/dist/triglavcode-* | head -1)"
          "./${DIR}/bin/triglavcode" --version
          mkdir -p release-artifacts
          zip -q -j "release-artifacts/triglavcode-${VERSION}-${{ matrix.name }}.zip" "${DIR}/bin/triglavcode"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path packages/opencode/dist -Recurse -Filter 'triglavcode.exe' | Select-Object -First 1
          if (-not $exe) { throw "triglavcode.exe not found" }
          & $exe.FullName --version
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Compress-Archive -Path $exe.FullName -DestinationPath "release-artifacts/triglavcode-windows-x64-gui.zip" -Force
          & "$env:GITHUB_WORKSPACE/installer/windows/build-installer.ps1" -Version $env:VERSION -SourceExe $exe.FullName
          Copy-Item "installer/windows/dist/TriglavCode-Setup-*.exe" -Destination release-artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error

  # Ручной запуск (workflow_dispatch) только собирает артефакты для проверки.
  # Публикация релиза — по тегу triglav-<версия>.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/triglav-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/triglav-* ]]; then
            VERSION="${GITHUB_REF#refs/tags/triglav-}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: List artifacts
        run: ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: triglav-${{ steps.version.outputs.version }}
          name: "TriglavCode ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          files: artifacts/*
